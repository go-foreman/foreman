version: "2"
run:
  go: "1.24"
  tests: true
  allow-parallel-runners: false
linters:
  default: none
  enable:
    - errcheck
    - gosec
    - govet
    - ineffassign
    - misspell
    - nestif
    - sqlclosecheck
    - staticcheck
    - unused
  settings:
    gosec:
      excludes:
        - G115
        - G404
        - G705
    staticcheck:
      checks:
        - "all"
        - "-QF*"
        - "-ST*"
    nestif:
      min-complexity: 8
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - staticcheck
        text: 'SA1019:'
    paths:
      - testing/mocks
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - testing/mocks
      - third_party$
      - builtin$
      - examples$
